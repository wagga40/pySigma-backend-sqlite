version: '3'

vars:
  POETRY: poetry

tasks:
  default:
    desc: Run all tests
    cmds:
      - task: test

  install:
    desc: Install dependencies with Poetry
    cmds:
      - "{{.POETRY}} install"

  test:
    desc: Run all tests with pytest
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/ -v"

  test:quick:
    desc: Run tests without verbose output
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/"

  test:coverage:
    desc: Run tests with coverage report
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/ -v --cov=sigma --cov-report=term-missing"

  test:coverage:html:
    desc: Run tests with HTML coverage report
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/ -v --cov=sigma --cov-report=html"
      - echo "Coverage report generated in htmlcov/index.html"

  test:single:
    desc: Run a single test (use TEST=test_name)
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/test_backend_sqlite.py::{{.TEST}} -v"
    vars:
      TEST: '{{default "test_sqlite_and_expression" .TEST}}'

  test:pattern:
    desc: Run tests matching a pattern (use PATTERN=pattern)
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/ -v -k '{{.PATTERN}}'"
    vars:
      PATTERN: '{{default "" .PATTERN}}'

  test:correlation:
    desc: Run only correlation tests
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/ -v -k 'correlation'"

  test:modifiers:
    desc: Run modifier-related tests
    deps: [install]
    cmds:
      - "{{.POETRY}} run pytest tests/ -v -k 'fieldref or timestamp or compare or all_modifier'"

  lint:
    desc: Lint and check formatting with ruff
    cmds:
      - "{{.POETRY}} run ruff check sigma/ tests/ tools/"
      - "{{.POETRY}} run ruff format --check sigma/ tests/ tools/"

  format:
    desc: Fix lint findings and format code with ruff
    cmds:
      - "{{.POETRY}} run ruff check --fix sigma/ tests/ tools/"
      - "{{.POETRY}} run ruff format sigma/ tests/ tools/"

  clean:
    desc: Clean up cache and build artifacts
    cmds:
      - rm -rf __pycache__ .pytest_cache .ruff_cache .coverage cov.xml htmlcov dist
      - find sigma tests tools -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true

  build:
    desc: Build the package
    deps: [install]
    cmds:
      - "{{.POETRY}} build"
