name: Test
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
    runs-on: ${{ matrix.os }}
    env:
      SQLITE_MIN: sqlite-amalgamation-3380000
      SQLITE_CURRENT: sqlite-amalgamation-3540100
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: poetry install
      - name: Build minimum supported SQLite
        if: matrix.python-version == '3.11'
        run: |
          curl --fail --location https://www.sqlite.org/2022/$SQLITE_MIN.zip --output /tmp/sqlite-min.zip
          unzip -q /tmp/sqlite-min.zip -d /tmp
          cc -O2 -DSQLITE_THREADSAFE=0 /tmp/$SQLITE_MIN/shell.c /tmp/$SQLITE_MIN/sqlite3.c -lm -ldl -o /tmp/sqlite-min
          echo "SQLITE_MIN_BINARY=/tmp/sqlite-min" >> "$GITHUB_ENV"
      - name: Build current SQLite runtime
        if: matrix.python-version == '3.11'
        run: |
          curl --fail --location https://www.sqlite.org/2026/$SQLITE_CURRENT.zip --output /tmp/sqlite-current.zip
          unzip -q /tmp/sqlite-current.zip -d /tmp
          mkdir /tmp/sqlite-current
          cc -O2 -fPIC -shared /tmp/$SQLITE_CURRENT/sqlite3.c -lm -ldl -o /tmp/sqlite-current/libsqlite3.so.0
          # Keep setup-python's own library path after ours.
          echo "LD_LIBRARY_PATH=/tmp/sqlite-current${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Verify current SQLite runtime
        if: matrix.python-version == '3.11'
        run: poetry run python -c "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 54)"
      - name: Run tests
        run: poetry run pytest --cov=sigma --cov-report term --cov-report xml:cov.xml -vv
      - name: Store coverage for badge
        if: ${{ runner.os == 'Linux' }}
        run: poetry run python print-coverage.py >> $GITHUB_ENV
      - name: Create coverage badge
        # One job only: concurrent gist updates fail with 409 Conflict.
        if: ${{ github.repository == 'wagga40/pySigma-backend-sqlite' && github.event_name == 'push' && runner.os == 'Linux' && matrix.python-version == '3.14' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 2ec45ded898fa11f2c42bcb9d2b163cf
          filename: test.json
          label: Coverage
          message: ${{ env.COVERAGE }}
          color: ${{ env.COVERAGE_COLOR }}

  corpus:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [raw, windows-sysmon, windows-audit, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SigmaHQ/sigma
          ref: 2e8fd89f82d9104c1b30321a307254ddeea17de2
          path: .corpus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install .
      # These pipeline releases still declare pysigma<2 but work unchanged on pySigma 2.
      # pysigma-pipeline-windows 2.0.1 rejects 10 registry rules under windows-audit
      # (fields without a Security 4657 equivalent), so the audit pins 2.0.0.
      - run: pip install --no-deps pysigma-pipeline-sysmon==2.0.0 pysigma-pipeline-windows==2.0.0
      - run: python tools/audit_corpus.py .corpus --profile ${{ matrix.profile }} --fulltext-field _sigma_fulltext --output corpus-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-${{ matrix.profile }}
          path: corpus-${{ matrix.profile }}.json
