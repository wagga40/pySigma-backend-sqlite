name: Release to PyPI
on:
  release:
    types: [published]
  push:
    tags:
      - v*.*.*

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Verify versioning
        run: |
          echo "$(poetry version -s)"
          echo "${GITHUB_REF#refs/tags/v}"
          [ "$(poetry version -s)" == "${GITHUB_REF#refs/tags/v}" ]
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest
      - name: Build packages
        run: poetry build
      # PyPI trusts only the SigmaHQ repository; a release elsewhere just tests and builds.
      - name: Publish to test PyPI
        if: ${{ github.event_name == 'push' && github.repository == 'SigmaHQ/pySigma-backend-sqlite' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' && github.repository == 'SigmaHQ/pySigma-backend-sqlite' }}
        uses: pypa/gh-action-pypi-publish@release/v1
